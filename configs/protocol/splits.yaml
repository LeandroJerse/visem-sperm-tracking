version: 1
dataset: VISEM-Tracking
grouping_unit: video_id
seeds: [42, 123, 2026]

fixed_split:
  train: [11, 12, 13, 15, 21, 22, 23, 29, 30, 35, 60, 82]
  val: [14, 19, 36, 52]
  test: [24, 38, 47, 54]

oof_folds:
  A: [24, 38, 47, 54]
  B: [13, 14, 19, 60]
  C: [11, 22, 29, 82]
  D: [12, 23, 35, 36]
  E: [15, 21, 30, 52]

annotation_policy:
  missing_label_file: unlabeled
  exclude_unlabeled_from_training: true
  exclude_unlabeled_from_metrics: true
  align_by_frame_number: true
  primary_class_policy: binary
  yolo_secondary_class_policy: class_aware

evaluation:
  primary_detection_metric: f1_center_15px
  center_gate_px: 15
  sensitivity_gates_px: [10, 20]
  primary_tracking_metric: HOTA
  prediction_horizons_frames: [1, 5, 10]
  prediction_history_frames: 20
