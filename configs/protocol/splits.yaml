version: 1
dataset: VISEM-Tracking
grouping_unit: video_id
seeds: [42, 123, 2026]

fixed_split:
  train: [11, 12, 13, 15, 21, 22, 23, 29, 30, 35, 60, 82]
  val: [14, 19, 36, 52]
  test: [24, 38, 47, 54]

oof_folds:
  A: [24, 38, 47, 54]
  B: [13, 14, 19, 60]
  C: [11, 22, 29, 82]
  D: [12, 23, 35, 36]
  E: [15, 21, 30, 52]

annotation_policy:
  missing_label_file: unlabeled
  exclude_unlabeled_from_training: true
  exclude_unlabeled_from_metrics: true
  align_by_frame_number: true
  primary_class_policy: individuals_ignore_clusters
  yolo_secondary_class_policy: class_aware

evaluation:
  # Detection evaluation approved on 2026-09-07; split membership is unchanged.
  protocol_id: center_distance_v3_individuals_ignore_clusters_10px
  primary_detection_metric: f1_individuals_center_10px
  class_policy: individuals_ignore_clusters
  secondary_detection_policy: binary_all_objects
  center_gate_px: 10
  sensitivity_gates_px: [15, 20]
  primary_tracking_metric: HOTA
  prediction_horizons_frames: [1, 5, 10]
  prediction_history_frames: 20
