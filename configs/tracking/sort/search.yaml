configuration_id: sort_search
method: sort
input_source: ground_truth
params:
  iou_threshold: 0.10
  max_age: 3
  min_hits: 1
  process_noise: 1.0
  measurement_noise: 4.0
  class_aware: false
  emit_predictions: false
search_space:
  iou_threshold: [0.0, 0.05, 0.10, 0.20, 0.30]
  max_age: [1, 2, 3, 5, 10]
  min_hits: [1, 2, 3]
  process_noise: [0.25, 1.0, 4.0]
  measurement_noise: [1.0, 4.0, 9.0]
evaluation:
  primary: HOTA
  complementary: [IDF1, MOTA, id_switches, fragmentations, track_recall]
  class_policy: binary
run:
  stage: screen
  split: train
  seed: 42
