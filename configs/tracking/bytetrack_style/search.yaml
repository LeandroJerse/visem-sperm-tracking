configuration_id: bytetrack_style_search
method: bytetrack_style
input_source: yolo
params:
  high_threshold: 0.60
  low_threshold: 0.10
  new_track_threshold: 0.60
  second_iou_threshold: 0.05
  iou_threshold: 0.10
  max_age: 3
  min_hits: 1
  class_aware: false
  emit_predictions: false
search_space:
  high_threshold: [0.4, 0.5, 0.6, 0.7]
  low_threshold: [0.05, 0.10, 0.20]
  second_iou_threshold: [0.0, 0.05, 0.10]
  iou_threshold: [0.05, 0.10, 0.20]
  max_age: [2, 3, 5, 10]
evaluation:
  primary: HOTA
  complementary: [IDF1, MOTA, id_switches, fragmentations, track_recall]
  class_policy: binary
run:
  stage: screen
  split: train
  seed: 42
