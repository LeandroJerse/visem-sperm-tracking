configuration_id: adaptive_flow_sort_search
method: adaptive_flow_sort
input_source: frozen_detector
flow_source: frozen_flow
params:
  base_distance: 18.0
  min_distance: 4.0
  velocity_scale: 1.5
  density_fraction: 0.75
  flow_weight: 1.0
  flow_window_scale: 1.5
  distance_weight: 0.7
  iou_weight: 0.3
  minimum_iou_override: 0.1
  iou_threshold: 0.1
  max_age: 3
  min_hits: 1
  process_noise: 1.0
  measurement_noise: 4.0
search_space:
  base_distance: [12, 18, 24, 30]
  min_distance: [3, 4, 6]
  velocity_scale: [0.5, 1.0, 1.5, 2.0]
  density_fraction: [0.5, 0.75, 1.0]
  flow_weight: [0.0, 0.5, 1.0, 1.5]
  distance_weight: [0.5, 0.7, 0.9]
evaluation:
  primary: HOTA
  complementary: [IDF1, MOTA, id_switches, fragmentations, track_recall]
  class_policy: binary
run:
  stage: screen
  split: train
  seed: 42
