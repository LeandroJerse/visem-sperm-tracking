configuration_id: knn_search
method: knn
params:
  min_area: 3
  max_area: 400
  history: 200
  dist2_threshold: 400
  detect_shadows: false
  morph_kernel: 3
search_space:
  history: [50, 100, 200]
  dist2_threshold: [100, 400, 900]
  morph_kernel: [3, 5]
  min_area: [3, 5]
  max_area: [200, 400]
sampling:
  unit: clip
  warmup_frames: 100
  scored_frames: 200
evaluation:
  protocol_id: center_distance_v3_individuals_ignore_clusters_10px
  center_gate_px: 10
  sensitivity_gates_px: [15, 20]
  class_policy: individuals_ignore_clusters
run:
  stage: screen
  split: train
  seed: 42
  save_video: false
  frozen: false
