configuration_id: farneback_search
method: farneback
params:
  pyr_scale: 0.5
  levels: 4
  winsize: 21
  iterations: 5
  poly_n: 7
  poly_sigma: 1.5
  gaussian: true
search_space:
  levels: [3, 4, 5]
  winsize: [11, 15, 21, 31]
  iterations: [3, 5, 7]
  poly_n: [5, 7]
  poly_sigma: [1.1, 1.3, 1.5]
  gaussian: [false, true]
evaluation:
  primary: photometric_warp_error
  complementary: [forward_backward_error, temporal_stability, latency]
  epe_only_on_synthetic: true
run:
  stage: screen
  split: train
  seed: 42
  cache: true
