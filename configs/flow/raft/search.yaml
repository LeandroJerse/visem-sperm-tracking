configuration_id: raft_search
method: raft
optional: true
params:
  variant: small
  weights: DEFAULT
  device: auto
  mixed_precision: true
search_space:
  variant: [small, large]
evaluation:
  primary: photometric_warp_error
  complementary: [forward_backward_error, temporal_stability, latency, vram]
  epe_only_on_synthetic: true
run:
  stage: screen
  split: train
  seed: 42
  cache: true
