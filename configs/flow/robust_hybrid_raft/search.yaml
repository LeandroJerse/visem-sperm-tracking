configuration_id: robust_hybrid_raft_search
method: robust_hybrid
variant: farneback_raft_refinement
base_method: farneback
refiner_method: raft
refiner_params:
  weights: default
params:
  refiner_weight: 0.5
  compensate_global: true
  reject_inconsistent: true
  consistency_threshold: 1.5
  global_max_corners: 1000
  global_ransac_threshold: 2.0
search_space:
  refiner_weight: [0.25, 0.5, 0.75]
  compensate_global: [false, true]
  consistency_threshold: [1.0, 1.5, 2.0]
evaluation:
  primary: photometric_warp_error
  complementary: [forward_backward_error, temporal_stability, latency]
  epe_only_on_synthetic: true
run:
  stage: screen
  split: train
  seed: 42
  cache: true
