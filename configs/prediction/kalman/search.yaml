configuration_id: kalman_search
method: kalman
params:
  process_variance: 0.25
  measurement_variance: 1.0
  initial_position_variance: 4.0
  initial_velocity_variance: 25.0
  dt: 1.0
search_space:
  process_variance: [0.01, 0.05, 0.25, 1.0, 4.0]
  measurement_variance: [0.25, 1.0, 4.0, 9.0]
  initial_velocity_variance: [4.0, 25.0, 100.0]
data:
  history_length: 20
  horizons: [1, 5, 10]
  trajectory_source: ground_truth
  split_by_video: true
evaluation:
  primary: [ADE, FDE]
  breakdowns: [horizon, track_length, cell_density]
run:
  stage: screen
  split: train
  seed: 42
