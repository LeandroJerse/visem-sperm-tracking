configuration_id: particle_filter_search
method: particle_filter
params:
  num_particles: 1000
  position_process_std: 0.35
  velocity_process_std: 0.15
  measurement_std: 1.0
  initial_position_std: 1.0
  initial_velocity_std: 1.0
  resample_threshold: 0.5
  seed: 42
search_space:
  num_particles: [100, 250, 500, 1000, 2000]
  position_process_std: [0.1, 0.35, 0.75]
  velocity_process_std: [0.05, 0.15, 0.5]
  measurement_std: [0.5, 1.0, 2.0]
  resample_threshold: [0.25, 0.5, 0.75]
data:
  history_length: 20
  horizons: [1, 5, 10]
  trajectory_source: ground_truth
  split_by_video: true
evaluation:
  primary: [ADE, FDE]
  breakdowns: [horizon, track_length, cell_density]
run:
  stage: screen
  split: train
  seed: 42
