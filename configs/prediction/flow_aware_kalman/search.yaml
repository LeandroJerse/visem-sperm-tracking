configuration_id: flow_aware_kalman_search
method: flow_aware_kalman
params:
  process_variance: 0.25
  measurement_variance: 1.0
  initial_position_variance: 4.0
  initial_velocity_variance: 25.0
  dt: 1.0
search_space:
  process_variance: [0.01, 0.05, 0.25, 1.0, 4.0]
  measurement_variance: [0.25, 1.0, 4.0, 9.0]
data:
  history_length: 20
  horizons: [1, 5, 10]
  trajectory_source: ground_truth
  flow_source: frozen_flow
  split_by_video: true
evaluation:
  primary: [ADE, FDE]
  paired_baseline: kalman
run:
  stage: screen
  split: train
  seed: 42
