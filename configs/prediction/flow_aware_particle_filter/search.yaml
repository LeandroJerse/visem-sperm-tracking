configuration_id: flow_aware_particle_filter_search
method: flow_aware_particle_filter
params:
  num_particles: 1000
  position_process_std: 0.35
  velocity_process_std: 0.15
  measurement_std: 1.0
  initial_position_std: 1.0
  initial_velocity_std: 1.0
  resample_threshold: 0.5
  seed: 42
search_space:
  num_particles: [100, 250, 500, 1000, 2000]
  position_process_std: [0.1, 0.35, 0.75]
  velocity_process_std: [0.05, 0.15, 0.5]
data:
  history_length: 20
  horizons: [1, 5, 10]
  trajectory_source: ground_truth
  flow_source: frozen_flow
  split_by_video: true
evaluation:
  primary: [ADE, FDE]
  paired_baseline: particle_filter
run:
  stage: screen
  split: train
  seed: 42
